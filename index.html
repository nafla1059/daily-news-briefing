<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7F0" id="theme-meta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아침 브리핑" />
  <title>매일 아침 브리핑</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FBF7F0;
      --surface: #FFFDF9;
      --surface-muted: #F4EDE1;
      --ink: #1A1816;
      --ink-secondary: #5B544C;
      --ink-tertiary: #7C7368;
      --border: #E5DCCD;
      --border-strong: #2A2521;
      --accent: #8B2635;
      --accent-soft: #F6E9EB;
      --deep-accent: #1E425E;
      --deep-soft: #EEF3F7;
      --pos-fg: #1D6B42;
      --pos-bg: #EBF5EE;
      --neg-fg: #A62C2B;
      --neg-bg: #FCECEB;
      --access-fg: #665E55;
      --access-bg: #EFE7D8;
      --font-scale: 1;
      --serif: "Noto Serif KR", Georgia, "AppleMyungjo", serif;
      --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #161412;
      --surface: #1F1C19;
      --surface-muted: #28231F;
      --ink: #EFE9DF;
      --ink-secondary: #B5ACA0;
      --ink-tertiary: #8B8277;
      --border: #312C27;
      --border-strong: #CFC4B4;
      --accent: #D97B86;
      --accent-soft: #312023;
      --deep-accent: #83B4D9;
      --deep-soft: #1B2630;
      --pos-fg: #68C490;
      --pos-bg: #192E23;
      --neg-fg: #EE837E;
      --neg-bg: #331D1D;
      --access-fg: #BEB4A7;
      --access-bg: #2A2520;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      font-size: calc(16px * var(--font-scale));
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.74;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .page-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 18px 64px;
    }

    /* Top utility bar */
    .utility-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--ink-secondary);
    }

    .brand-tag {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-size: 0.72rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-secondary);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      line-height: 1.2;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .ctrl-btn:hover,
    .ctrl-btn[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Masthead */
    .masthead {
      padding: 20px 0 16px;
      border-bottom: 2px solid var(--border-strong);
      text-align: left;
    }

    .masthead-kicker {
      font-family: var(--sans);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--ink-tertiary);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .masthead-date {
      font-family: var(--serif);
      font-size: clamp(1.65rem, 5.5vw, 2.2rem);
      font-weight: 900;
      line-height: 1.22;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .masthead-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.82rem;
      color: var(--ink-secondary);
    }

    .masthead-meta span::before {
      content: "• ";
      color: var(--accent);
      font-weight: 700;
    }

    .masthead-meta span:first-child::before {
      content: "";
    }

    /* Archive navigation */
    .archive-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .archive-nav-btns {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
    }

    .nav-btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .date-select {
      flex: 1;
      max-width: 240px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.84rem;
      font-weight: 600;
      font-family: var(--sans);
    }

    /* Sticky section pills */
    .section-pills {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .section-pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink-secondary);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pill-count {
      font-size: 0.72rem;
      color: var(--ink-tertiary);
      font-weight: 500;
    }

    /* Sections */
    .briefing-section {
      margin-top: 28px;
      scroll-margin-top: 56px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border-strong);
      margin-bottom: 6px;
    }

    .section-title {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-num {
      color: var(--accent);
    }

    .section-sub {
      font-size: 0.76rem;
      color: var(--ink-tertiary);
    }

    .empty-state {
      padding: 18px 0;
      color: var(--ink-tertiary);
      font-size: 0.92rem;
      border-bottom: 1px solid var(--border);
    }

    /* News item */
    .story-card {
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }

    .story-card:last-child {
      border-bottom: none;
    }

    .story-meta-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .source-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.71rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .badge-pos {
      color: var(--pos-fg);
      background: var(--pos-bg);
    }

    .badge-neg {
      color: var(--neg-fg);
      background: var(--neg-bg);
    }

    .badge-access {
      color: var(--access-fg);
      background: var(--access-bg);
      font-weight: 600;
    }

    .badge-followup {
      color: #7A4B1E;
      background: #F5EADB;
    }

    html[data-theme="dark"] .badge-followup {
      color: #E6B57E;
      background: #33271A;
    }

    /* Executive brief */
    .exec-brief {
      margin-top: 22px;
      padding: 15px 17px;
      background: var(--surface-muted);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
    }

    .exec-brief-title {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin: 0 0 8px;
    }

    .exec-brief-list {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 6px;
      font-size: 0.93rem;
      line-height: 1.66;
      color: var(--ink);
      word-break: keep-all;
    }

    .story-title {
      font-family: var(--serif);
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.44;
      margin: 0 0 8px;
      color: var(--ink);
      word-break: keep-all;
    }

    .title-link {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .title-link:hover,
    .title-link:focus-visible {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    .title-arrow {
      display: inline-block;
      margin-left: 5px;
      font-family: var(--sans);
      font-size: 0.78em;
      font-weight: 600;
      color: var(--ink-tertiary);
      vertical-align: 1px;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .title-link:hover .title-arrow {
      color: var(--accent);
      transform: translate(1px, -1px);
    }

    .story-summary {
      margin: 0;
      font-size: 0.96rem;
      color: var(--ink);
      line-height: 1.74;
      word-break: keep-all;
    }

    /* Opinion cards */
    .opinion-card {
      margin-top: 16px;
      padding: 18px 18px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3.5px solid var(--accent);
      border-radius: 4px;
    }

    .opinion-meta-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .opinion-byline {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .opinion-byline strong {
      color: var(--accent);
    }

    .opinion-title {
      font-family: var(--serif);
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.42;
      margin: 0 0 14px;
      color: var(--ink);
      word-break: keep-all;
    }

    .opinion-orig-title {
      font-size: 0.84rem;
      color: var(--ink-tertiary);
      font-style: italic;
      line-height: 1.45;
      margin: -8px 0 12px;
      word-break: normal;
    }

    .opinion-grid {
      display: grid;
      gap: 10px;
    }

    .opinion-block {
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .opinion-block:first-child {
      padding-top: 0;
      border-top: none;
    }

    .opinion-label {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }

    .opinion-text {
      margin: 0;
      font-size: 0.94rem;
      line-height: 1.72;
      color: var(--ink);
      word-break: keep-all;
    }

    /* Deep-dive cards */
    .deepdive-card {
      margin-top: 16px;
      padding: 20px 20px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--deep-accent);
      border-left: 3.5px solid var(--deep-accent);
      border-radius: 4px;
    }

    .deepdive-meta-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .deepdive-kicker {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--deep-accent);
      background: var(--deep-soft);
    }

    .deepdive-byline {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .deepdive-byline strong {
      color: var(--deep-accent);
    }

    .deepdive-title {
      font-family: var(--serif);
      font-size: 1.18rem;
      font-weight: 700;
      line-height: 1.44;
      margin: 0 0 14px;
      color: var(--ink);
      word-break: keep-all;
    }

    .deepdive-grid {
      display: grid;
      gap: 12px;
    }

    .deepdive-block {
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .deepdive-block:first-child {
      padding-top: 0;
      border-top: none;
    }

    .deepdive-label {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--deep-accent);
      letter-spacing: 0.02em;
      margin-bottom: 3px;
    }

    .deepdive-text {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.78;
      color: var(--ink);
      word-break: keep-all;
    }

    .deepdive-prose {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: grid;
      gap: 8px;
    }

    .site-footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--ink-tertiary);
      text-align: center;
    }

    @media (max-width: 480px) {
      .page-shell {
        padding: 14px 15px 52px;
      }
      .opinion-card,
      .deepdive-card {
        padding: 15px 14px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="utility-bar">
      <span class="brand-tag">Morning Briefing · 매일 아침 브리핑</span>
      <div class="controls">
        <button type="button" class="ctrl-btn" id="font-dec" aria-label="글자 작게">가-</button>
        <button type="button" class="ctrl-btn" id="font-reset" aria-label="기본 글자">가</button>
        <button type="button" class="ctrl-btn" id="font-inc" aria-label="글자 크게">가+</button>
        <button type="button" class="ctrl-btn" id="theme-toggle" aria-label="다크모드 전환">☾</button>
      </div>
    </div>

    <header class="masthead">
      <div class="masthead-kicker" id="masthead-kicker">매일 오전 07:00 KST · 국내외 주요 변화 · 심층취재 &amp; 오피니언</div>
      <h1 class="masthead-date" id="masthead-date">불러오는 중...</h1>
      <div class="masthead-meta" id="masthead-meta"></div>
    </header>

    <nav class="archive-nav" aria-label="날짜 선택">
      <select class="date-select" id="date-select" aria-label="브리핑 날짜"></select>
      <div class="archive-nav-btns">
        <button type="button" class="nav-btn" id="prev-day">← 이전</button>
        <button type="button" class="nav-btn" id="next-day">다음 →</button>
      </div>
    </nav>

    <nav class="section-pills" id="section-pills" aria-label="구역 바로가기"></nav>

    <main id="briefing-main"></main>

    <footer class="site-footer" id="site-footer">
      매일 오전 07:00(Asia/Seoul) 자동 수집·검증 브리핑 · 웹 최근 7일 보관
    </footer>
  </div>

  <script src="./data/archive.js"></script>
  <script>
    (function () {
      "use strict";

      var archive = Array.isArray(window.__BRIEFING_ARCHIVE__) ? window.__BRIEFING_ARCHIVE__ : [];
      var currentIdx = 0;

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function safeUrl(url) {
        var u = String(url || "").trim();
        return /^https?:\/\//i.test(u) ? u : "#";
      }

      function applyTheme(theme) {
        var root = document.documentElement;
        var btn = document.getElementById("theme-toggle");
        var meta = document.getElementById("theme-meta");
        if (theme === "dark") {
          root.setAttribute("data-theme", "dark");
          if (btn) btn.textContent = "☀";
          if (meta) meta.setAttribute("content", "#161412");
        } else {
          root.removeAttribute("data-theme");
          if (btn) btn.textContent = "☾";
          if (meta) meta.setAttribute("content", "#FBF7F0");
        }
        try { localStorage.setItem("briefing_theme", theme); } catch (e) {}
      }

      function applyFontScale(scale) {
        var clamped = Math.max(0.88, Math.min(1.24, scale));
        document.documentElement.style.setProperty("--font-scale", clamped.toFixed(2));
        try { localStorage.setItem("briefing_font_scale", clamped.toFixed(2)); } catch (e) {}
        return clamped;
      }

      var savedTheme = "light";
      var savedScale = 1.0;
      try {
        savedTheme = localStorage.getItem("briefing_theme") || "light";
        var rawScale = parseFloat(localStorage.getItem("briefing_font_scale") || "1");
        if (!isNaN(rawScale)) savedScale = rawScale;
      } catch (e) {}

      applyTheme(savedTheme);
      savedScale = applyFontScale(savedScale);

      document.getElementById("theme-toggle").addEventListener("click", function () {
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        applyTheme(isDark ? "light" : "dark");
      });
      document.getElementById("font-dec").addEventListener("click", function () {
        savedScale = applyFontScale(savedScale - 0.06);
      });
      document.getElementById("font-reset").addEventListener("click", function () {
        savedScale = applyFontScale(1.0);
      });
      document.getElementById("font-inc").addEventListener("click", function () {
        savedScale = applyFontScale(savedScale + 0.06);
      });

      function renderAccessBadges(tags) {
        if (!Array.isArray(tags) || !tags.length) return "";
        return tags
          .map(function (t) {
            return '<span class="badge badge-access">' + esc(t) + "</span>";
          })
          .join("");
      }

      function renderSentimentBadge(sentiment) {
        if (sentiment === "긍정") return '<span class="badge badge-pos">긍정</span>';
        if (sentiment === "부정") return '<span class="badge badge-neg">부정</span>';
        return "";
      }

      function renderLinkedTitle(title, url) {
        var u = safeUrl(url);
        if (u === "#") return esc(title);
        return (
          '<a class="title-link" href="' +
          esc(u) +
          '" target="_blank" rel="noopener noreferrer">' +
          esc(title) +
          '<span class="title-arrow" aria-hidden="true">↗</span></a>'
        );
      }

      function renderExecutiveBrief(lines) {
        if (!Array.isArray(lines) || !lines.length) return "";
        var itemsHtml = lines
          .map(function (line) {
            return "<li>" + esc(line) + "</li>";
          })
          .join("");
        return (
          '<aside class="exec-brief" aria-label="오늘의 핵심 흐름">' +
          '<div class="exec-brief-title">오늘의 핵심 흐름 · EXECUTIVE BRIEF</div>' +
          '<ul class="exec-brief-list">' +
          itemsHtml +
          "</ul>" +
          "</aside>"
        );
      }

      function renderNewsSection(id, numSymbol, label, items, subText) {
        var bodyHtml = "";
        if (!items || !items.length) {
          bodyHtml = '<div class="empty-state">선정 없음</div>';
        } else {
          bodyHtml = items
            .map(function (item) {
              var sourceHtml = item.source
                ? '<span class="source-label">' + esc(item.source) + "</span>"
                : "";
              var followupHtml = item.is_followup
                ? '<span class="badge badge-followup">후속</span>'
                : "";
              var sentHtml = renderSentimentBadge(item.sentiment);
              var accessHtml = renderAccessBadges(item.access_tags);
              var metaHtml =
                sourceHtml || followupHtml || sentHtml || accessHtml
                  ? '<div class="story-meta-top">' +
                    sourceHtml +
                    followupHtml +
                    sentHtml +
                    accessHtml +
                    "</div>"
                  : "";
              return (
                '<article class="story-card">' +
                metaHtml +
                '<h3 class="story-title">' +
                renderLinkedTitle(item.title, item.url) +
                "</h3>" +
                '<p class="story-summary">' +
                esc(item.summary) +
                "</p>" +
                "</article>"
              );
            })
            .join("");
        }

        return (
          '<section class="briefing-section" id="sec-' +
          id +
          '">' +
          '<div class="section-header">' +
          '<h2 class="section-title"><span class="section-num">' +
          esc(numSymbol) +
          "</span> " +
          esc(label) +
          "</h2>" +
          '<span class="section-sub">' +
          esc(subText) +
          "</span>" +
          "</div>" +
          bodyHtml +
          "</section>"
        );
      }

      function renderDeepdiveSection(items, windowLabel) {
        if (!Array.isArray(items) || !items.length) return "";
        var bodyHtml = items
          .map(function (item) {
            var bylineParts = [];
            if (item.source) bylineParts.push("<strong>" + esc(item.source) + "</strong>");
            if (item.author) bylineParts.push(esc(item.author));
            var bylineHtml = bylineParts.length
              ? '<span class="deepdive-byline">' + bylineParts.join(" · ") + "</span>"
              : "";
            var accessHtml = renderAccessBadges(item.access_tags);
            var metaHtml =
              '<div class="deepdive-meta-top">' +
              '<span class="deepdive-kicker">DEEP DIVE · 심층취재</span>' +
              bylineHtml +
              accessHtml +
              "</div>";

            var blocks = [
              ["핵심 의제와 배경", item.context],
              ["핵심 근거와 데이터", item.evidence],
              ["쟁점과 파급효과", item.impact],
              ["향후 관전 포인트", item.watch_points],
            ]
              .filter(function (pair) {
                return Boolean(pair[1]);
              })
              .map(function (pair) {
                return (
                  '<div class="deepdive-block">' +
                  '<span class="deepdive-label">' +
                  esc(pair[0]) +
                  "</span>" +
                  '<p class="deepdive-text">' +
                  esc(pair[1]) +
                  "</p>" +
                  "</div>"
                );
              })
              .join("");

            var proseHtml = "";
            if (Array.isArray(item.body_paragraphs) && item.body_paragraphs.length) {
              proseHtml =
                '<div class="deepdive-prose">' +
                item.body_paragraphs
                  .map(function (p) {
                    return '<p class="deepdive-text">' + esc(p) + "</p>";
                  })
                  .join("") +
                "</div>";
            }

            var origTitleHtml = item.original_title
              ? '<div class="opinion-orig-title">' + esc(item.original_title) + "</div>"
              : "";

            return (
              '<article class="deepdive-card">' +
              metaHtml +
              '<h3 class="deepdive-title">' +
              renderLinkedTitle(item.title, item.url) +
              "</h3>" +
              origTitleHtml +
              (blocks ? '<div class="deepdive-grid">' + blocks + "</div>" : "") +
              proseHtml +
              "</article>"
            );
          })
          .join("");

        var subLabel = windowLabel ? windowLabel + " 글로벌 의제" : "직전 2주 글로벌 의제";
        return (
          '<section class="briefing-section" id="sec-deepdive">' +
          '<div class="section-header">' +
          '<h2 class="section-title"><span class="section-num">④</span> 심층취재</h2>' +
          '<span class="section-sub">' +
          esc(subLabel) +
          "</span>" +
          "</div>" +
          bodyHtml +
          "</section>"
        );
      }

      function renderOpinionSection(items, numSymbol, windowLabel) {
        var bodyHtml = "";
        if (!items || !items.length) {
          bodyHtml = '<div class="empty-state">선정 없음</div>';
        } else {
          bodyHtml = items
            .map(function (item) {
              var bylineParts = [];
              if (item.source) bylineParts.push("<strong>" + esc(item.source) + "</strong>");
              if (item.author) bylineParts.push(esc(item.author));
              var bylineHtml = bylineParts.length
                ? '<span class="opinion-byline">' + bylineParts.join(" · ") + "</span>"
                : "";
              var accessHtml = renderAccessBadges(item.access_tags);
              var metaHtml =
                bylineHtml || accessHtml
                  ? '<div class="opinion-meta-top">' + bylineHtml + accessHtml + "</div>"
                  : "";

              var blocks = [
                ["핵심 주장", item.core_claim],
                ["주요 논거", item.arguments],
                ["새로운 관점", item.new_perspective],
                ["의미와 한계", item.significance_limits],
              ]
                .filter(function (pair) {
                  return Boolean(pair[1]);
                })
                .map(function (pair) {
                  return (
                    '<div class="opinion-block">' +
                    '<span class="opinion-label">' +
                    esc(pair[0]) +
                    "</span>" +
                    '<p class="opinion-text">' +
                    esc(pair[1]) +
                    "</p>" +
                    "</div>"
                  );
                })
                .join("");

              var origTitleHtml = item.original_title
                ? '<div class="opinion-orig-title">' + esc(item.original_title) + "</div>"
                : "";

              return (
                '<article class="opinion-card">' +
                metaHtml +
                '<h3 class="opinion-title">' +
                renderLinkedTitle(item.title, item.url) +
                "</h3>" +
                origTitleHtml +
                '<div class="opinion-grid">' +
                blocks +
                "</div>" +
                "</article>"
              );
            })
            .join("");
        }

        var subLabel = windowLabel ? windowLabel + " 심층 분석" : "심층 분석";
        return (
          '<section class="briefing-section" id="sec-opinion">' +
          '<div class="section-header">' +
          '<h2 class="section-title"><span class="section-num">' +
          esc(numSymbol || "④") +
          "</span> 사설·오피니언</h2>" +
          '<span class="section-sub">' +
          esc(subLabel) +
          "</span>" +
          "</div>" +
          bodyHtml +
          "</section>"
        );
      }

      function renderDay(idx) {
        if (!archive.length) {
          document.getElementById("masthead-date").textContent = "아직 브리핑이 없습니다";
          document.getElementById("briefing-main").innerHTML =
            '<div class="empty-state">옵시디언 뉴스 브리핑 폴더에 날짜별 브리핑이 생성되면 여기에 표시됩니다.</div>';
          return;
        }
        currentIdx = Math.max(0, Math.min(archive.length - 1, idx));
        var day = archive[currentIdx];

        document.title = (day.display_date || day.date) + " · 매일 아침 브리핑";
        document.getElementById("masthead-date").textContent = day.display_date || day.date;

        var metaSpans = [];
        if (day.reference_time) metaSpans.push("<span>" + esc(day.reference_time) + "</span>");
        if (day.news_window) metaSpans.push("<span>뉴스 " + esc(day.news_window) + "</span>");
        if (day.deepdive_window) metaSpans.push("<span>심층취재 " + esc(day.deepdive_window) + "</span>");
        if (day.opinion_window) metaSpans.push("<span>오피니언 " + esc(day.opinion_window) + "</span>");
        document.getElementById("masthead-meta").innerHTML = metaSpans.join("");

        var selectEl = document.getElementById("date-select");
        selectEl.value = day.date;
        document.getElementById("prev-day").disabled = currentIdx >= archive.length - 1;
        document.getElementById("next-day").disabled = currentIdx <= 0;

        var sec = day.sections || {};
        var breaking = sec.breaking || [];
        var domestic = sec.domestic || [];
        var international = sec.international || [];
        var deepdive = sec.deepdive || [];
        var opinion = sec.opinion || [];
        var hasDeepdive = deepdive.length > 0;
        var opinionNum = hasDeepdive ? "⑤" : "④";

        var pills = [
          ["breaking", "① 속보", breaking.length],
          ["domestic", "② 국내", domestic.length],
          ["international", "③ 해외", international.length],
        ];
        if (hasDeepdive) {
          pills.push(["deepdive", "④ 심층취재", deepdive.length]);
        }
        pills.push(["opinion", opinionNum + " 오피니언", opinion.length]);

        document.getElementById("section-pills").innerHTML = pills
          .map(function (p) {
            return (
              '<a class="pill" href="#sec-' +
              p[0] +
              '">' +
              esc(p[1]) +
              '<span class="pill-count">' +
              p[2] +
              "</span></a>"
            );
          })
          .join("");

        document.getElementById("briefing-main").innerHTML =
          renderExecutiveBrief(day.executive_brief) +
          renderNewsSection("breaking", "①", "속보", breaking, breaking.length + "건") +
          renderNewsSection("domestic", "②", "국내", domestic, domestic.length + "건") +
          renderNewsSection("international", "③", "해외", international, international.length + "건") +
          renderDeepdiveSection(deepdive, day.deepdive_window) +
          renderOpinionSection(opinion, opinionNum, day.opinion_window);

        try {
          var url = new URL(window.location.href);
          url.searchParams.set("date", day.date);
          window.history.replaceState({}, "", url.toString());
        } catch (e) {}
      }

      function initArchive() {
        var selectEl = document.getElementById("date-select");
        if (!archive.length) {
          selectEl.style.display = "none";
          document.getElementById("prev-day").style.display = "none";
          document.getElementById("next-day").style.display = "none";
          renderDay(0);
          return;
        }

        selectEl.innerHTML = archive
          .map(function (d) {
            return '<option value="' + esc(d.date) + '">' + esc(d.display_date || d.date) + "</option>";
          })
          .join("");

        var startIdx = 0;
        try {
          var qDate = new URLSearchParams(window.location.search).get("date");
          if (qDate) {
            var found = archive.findIndex(function (d) { return d.date === qDate; });
            if (found >= 0) startIdx = found;
          }
        } catch (e) {}

        selectEl.addEventListener("change", function () {
          var idx = archive.findIndex(function (d) { return d.date === selectEl.value; });
          if (idx >= 0) renderDay(idx);
        });
        document.getElementById("prev-day").addEventListener("click", function () {
          if (currentIdx < archive.length - 1) renderDay(currentIdx + 1);
        });
        document.getElementById("next-day").addEventListener("click", function () {
          if (currentIdx > 0) renderDay(currentIdx - 1);
        });

        renderDay(startIdx);
      }

      if (archive.length) {
        initArchive();
      } else {
        fetch("./data/archive.json")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (Array.isArray(data)) archive = data;
            initArchive();
          })
          .catch(function () { initArchive(); });
      }
    })();
  </script>
</body>
</html>
